name: Build release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # One-time signing key: created here, never stored, gone when the job ends.
      - name: Create one-time signing key
        run: |
          PW="$(openssl rand -hex 24)"
          echo "::add-mask::$PW"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore android/app/release.keystore -alias androidkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=ZugIt"

      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: zugit-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
